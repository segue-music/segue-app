name: segue
description: "A music player for Navidrome and Jellyfin, with Segue Connect"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # Material's own words (tooltips, the text fields' menu) in the app's languages.
  flutter_localizations:
    sdk: flutter
  # The time the player counts a song's play by, which tests fake (fake_async).
  clock: ^1.1.3
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  audio_service_mpris: ^0.2.1
  path_provider: ^2.1.6
  # SVG paths since 1.0, drawn through ThemedIcon (lib/ui/themed_icon.dart). Their thin strokes need
  # Skia on Linux (linux/runner/my_application.cc): Flutter 3.47's Impeller left them jagged there.
  hugeicons: ^1.2.0
  # The app's words in each language (lib/l10n), dates and plurals.
  intl: ^0.20.2
  # Whether the device is on mobile data or not, for the automatic quality (lib/mobile_data.dart).
  connectivity_plus: ^7.3.1
  # Opens what is outside the app: where an artist comes from, on a map (lib/ui/maps.dart).
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  image: ^4.10.1
  shared_preferences_platform_interface: ^2.4.2
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  # The app's words, from lib/l10n's ARB files (l10n.yaml), on pub get and on every build.
  generate: true
  assets:
    - assets/logo.png
    - assets/logo_large.png
    # The notices and licenses of the libraries media_kit brings (lib/player/libmpv_licenses.dart).
    - assets/licenses/
